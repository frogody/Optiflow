name: Check site
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check   # tests, data validation, both builds, link + config checks
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix qa
      - run: npx --prefix qa playwright-core install --with-deps chromium
      - run: node qa/run.mjs   # layout, axe, CSP, booking flows, no-JS, mocked form endpoint
